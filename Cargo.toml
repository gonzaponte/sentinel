[package]
name = "sentinel"
version = "0.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pretty_assertions = "1.4.1"
rand = "0.9.2"
rand_distr = "0.5.1"
nalgebra = "0.34.1"
float_eq = "1.0.1"
clap = { version = "4.5.56", features = ["derive"] }
toml = "0.9.11"
serde = { version = "1.0", features = ["derive"] }
derive-new = "0.7.0"
config = "0.15.19"
cached = "0.56.0"
rayon = "1.11.0"
ndhistogram = { version = "0.10.0", features = ["rayon"] }
itertools = "0.14.0"
indicatif = "0.18.3"
tempfile = "3.24.0"
hdf5_metno = { package = "hdf5-metno", version = "0.12.3" , features=["blosc-zlib"]}
ndarray = "0.17.2"
